# La app vive en Cloudflare Pages (ver README, "App publicada"). Netlify solo atiende la dirección
# vieja: muestra mudanza.html, que lleva lo guardado en el navegador a la nueva (o redirige directo
# si no hay nada). Cloudflare ignora este archivo.
[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/mudanza.html"
  status = 200
  force = true
